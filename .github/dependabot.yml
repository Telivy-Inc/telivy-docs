version: 2

# Actions are pinned to commit SHAs, which is safe but freezes them.
# Dependabot keeps the pins current and annotates each bump with its version.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Wait out the window in which a compromised release is usually caught and yanked.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    labels:
      - ci
